<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Match Details — FootSub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="brand">FOOT<span class="sub">SUB</span></a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="matches.html" class="active">Matches</a>
      <a href="standings.html">Standings</a>
      <a href="bracket.html">Bracket</a>
      <a href="teams.html">Teams</a>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</header>

<div class="ticker"><div class="ticker-track"></div></div>

<section class="page-head" id="match-header"><p style="color:rgba(255,255,255,0.7);">Loading…</p></section>

<section class="section">
  <div class="wrap">
    <p class="crumbs"><a href="matches.html">← Back to all matches</a></p>

    <div id="motm-slot"></div>

    <div class="tabs" data-group="match">
      <button class="tab-btn active" data-group-ref="match" data-tab="stats">Stats</button>
      <button class="tab-btn" data-group-ref="match" data-tab="lineups">Lineups</button>
      <button class="tab-btn" data-group-ref="match" data-tab="timeline">Timeline</button>
    </div>

    <div class="tab-panel active" data-group-ref="match" data-tab="stats">
      <div class="stat-panel" id="stats-panel"></div>
    </div>

    <div class="tab-panel" data-group-ref="match" data-tab="lineups">
      <div class="stat-panel" id="lineups-panel" style="display:grid; grid-template-columns:1fr 1fr; gap:24px;"></div>
    </div>

    <div class="tab-panel" data-group-ref="match" data-tab="timeline">
      <div class="stat-panel" id="timeline-panel"></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 FootSub.</span>
    </div>
  </div>
</footer>

<script src="data.js"></script>
<script src="main.js"></script>
<script>
  const matchId = getQueryParam('id') || 'm1';

  (async function(){
    try{
      const match = await getMatchById(matchId);

      if(!match){
        document.getElementById('match-header').innerHTML = `<div class="wrap"><h1>Match not found</h1><p>Try going back to <a href="matches.html" style="color:var(--white);">all matches</a>.</p></div>`;
        return;
      }

      document.title = `${match.home_team} vs ${match.away_team} — FootSub`;

      const score = match.status === 'UPCOMING' ? 'vs' : `${match.home_score} – ${match.away_score}`;
      const statusLine = match.status === 'LIVE' ? `LIVE · ${match.minute}'` :
                          match.status === 'FT' ? 'Full time' :
                          new Date(match.kickoff_utc).toLocaleString(undefined,{weekday:'long', hour:'2-digit', minute:'2-digit', month:'long', day:'numeric'});

      const homeCode = match.home_team.slice(0,3).toUpperCase(), awayCode = match.away_team.slice(0,3).toUpperCase();

      document.getElementById('match-header').innerHTML = `
        <div class="wrap">
          <p style="font-family:var(--font-mono); font-size:12.5px; color:rgba(255,255,255,0.6); letter-spacing:1px; text-transform:uppercase; margin:0 0 12px;">${match.competition}</p>
          <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
            <div style="display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-size:22px; ${match.winner === 'home' ? 'font-weight:700;' : 'opacity:0.85;'}">
              ${crestImg(match.home_logo, homeCode, 36)}
              ${match.home_team}
            </div>
            <div style="font-family:var(--font-mono); font-size:34px; font-weight:700;">${score}</div>
            <div style="display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-size:22px; ${match.winner === 'away' ? 'font-weight:700;' : 'opacity:0.85;'}">
              ${crestImg(match.away_logo, awayCode, 36)}
              ${match.away_team}
            </div>
          </div>
          <p style="margin-top:10px; color:rgba(255,255,255,0.7); font-size:14px;">${statusLine}</p>
        </div>`;

      const statsPanel = document.getElementById('stats-panel');
      const lineupsPanel = document.getElementById('lineups-panel');
      const timelinePanel = document.getElementById('timeline-panel');
      const motmSlot = document.getElementById('motm-slot');
      statsPanel.innerHTML = '<p class="placeholder-note">Loading stats…</p>';
      lineupsPanel.innerHTML = '<p class="placeholder-note">Loading lineups…</p>';
      timelinePanel.innerHTML = '<p class="placeholder-note">Loading timeline…</p>';

      const [stats, lineups, events, motm] = await Promise.all([
        getStatsForMatch(matchId),
        getLineupsForMatch(matchId),
        getEventsForMatch(matchId),
        getMotmForMatch(matchId)
      ]);

      if(motm){
        motmSlot.innerHTML = `
          <div class="motm-card">
            <img src="${motm.photo}" alt="${motm.name}" onerror="this.style.display='none'">
            <div>
              <p class="motm-label">Man of the Match</p>
              <h3>${motm.name}</h3>
              <p>${motm.team}${motm.goals ? ' · ' + motm.goals + ' goal' + (motm.goals > 1 ? 's' : '') : ''}</p>
            </div>
            <span class="motm-rating">${motm.rating}</span>
          </div>`;
      }

      if(stats){
        const rows = [
          ['Possession', stats.possession],
          ['Shots', stats.shots],
          ['Shots on target', stats.shots_on_target],
          ['Corners', stats.corners],
          ['Fouls', stats.fouls],
        ];
        statsPanel.innerHTML = rows.map(([label, vals]) => {
          const a = parseInt(vals[0]) || 0, b = parseInt(vals[1]) || 0;
          const total = a + b || 1;
          const pctA = Math.round(a / total * 100);
          return `
            <div class="stat-row">
              <span style="text-align:right; font-weight:700;">${vals[0]}</span>
              <span class="label">${label}</span>
              <span style="font-weight:700;">${vals[1]}</span>
              <span class="bar-wrap"><span class="bar-a" style="width:${pctA}%"></span><span class="bar-b" style="width:${100-pctA}%"></span></span>
            </div>`;
        }).join('');
      } else {
        statsPanel.innerHTML = `<p class="placeholder-note">No stats available yet for this match.</p>`;
      }

      if(lineups){
        lineupsPanel.innerHTML = `
          <div>
            <h3 style="font-family:var(--font-display); margin-top:0;">${match.home_team} <span style="color:var(--ink-soft); font-size:13px; font-family:var(--font-mono);">(${lineups.home.formation})</span></h3>
            <ul>${lineups.home.starters.map(p => `<li style="padding:6px 0; border-bottom:1px solid var(--line); font-size:14px;">${p}</li>`).join('')}</ul>
          </div>
          <div>
            <h3 style="font-family:var(--font-display); margin-top:0;">${match.away_team} <span style="color:var(--ink-soft); font-size:13px; font-family:var(--font-mono);">(${lineups.away.formation})</span></h3>
            <ul>${lineups.away.starters.map(p => `<li style="padding:6px 0; border-bottom:1px solid var(--line); font-size:14px;">${p}</li>`).join('')}</ul>
          </div>`;
      } else {
        lineupsPanel.innerHTML = `<p class="placeholder-note">Lineups not out yet.</p>`;
      }

      timelinePanel.innerHTML = events.length ? events.map(e => `
        <div class="stat-row" style="grid-template-columns:50px 1fr;">
          <span style="font-family:var(--font-mono); font-weight:700; color:var(--ink);">${e.minute}'</span>
          <span>${e.type === 'goal' ? '⚽ Goal' : e.type === 'yellow' ? '🟨 Yellow card' : '🟥 Red card'} — ${e.player} (${e.team === 'home' ? match.home_team : match.away_team})</span>
        </div>`).join('') : `<p class="placeholder-note">No events yet.</p>`;

    } catch(err){
      console.error(err);
      document.getElementById('match-header').innerHTML = `<div class="wrap"><h1>Couldn't load match</h1><p>omo api key solos.</p></div>`;
    }
  })();
</script>
</body>
</html>
